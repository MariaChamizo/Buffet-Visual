name: Publicar Buffet Visual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y preparar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Compilar estilos
        run: |
          npm exec --yes --package=sass@1.108.1 -- sass --no-source-map --style=expanded --silence-deprecation=import landing/main.scss landing/styles.css
          for name in popup report gestion; do cp "extension/$name.scss" "extension/$name.css"; done
      - name: Comprobar reloj y exportación
        run: node extension/pruebas/tests-clock.mjs
      - name: Preparar web y extensión descargable
        run: node herramientas/preparar-web.mjs
      - name: Guardar web preparada
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .preview/site

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
